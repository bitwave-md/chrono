services:
  storage:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  db:
    ports:
      - "127.0.0.1:5432:5432"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  app:
    environment:
      EMAIL_SERVER: smtp://mailpit:1025
    depends_on:
      mailpit:
        condition: service_started
