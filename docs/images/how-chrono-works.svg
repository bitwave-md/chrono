<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="How Chrono is organized: a client holds projects and client tasks; tasks collect time; time becomes reports">
<title>How Chrono is organized</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4338CA"/><stop offset=".55" stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#4338CA" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#8B5CF6"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="998" height="558" rx="28" fill="#FAF9FF" stroke="#E4E1FA" stroke-width="2"/>

<!-- Client card -->
<g filter="url(#soft)">
<rect x="32" y="32" width="640" height="496" rx="22" fill="#fff" stroke="#CFC8F7" stroke-width="2"/>
</g>
<path d="M32 54a22 22 0 0 1 22-22h596a22 22 0 0 1 22 22v40H32z" fill="url(#brand)"/>
<circle cx="72" cy="63" r="19" fill="#fff" fill-opacity=".22"/>
<path d="M63 56h14v8a7 7 0 0 1-7 7h0a7 7 0 0 1-7-7zM77 59h3a3 3 0 0 1 0 6h-3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="104" y="55" font-size="11" font-weight="700" letter-spacing="1.6" fill="#fff" fill-opacity=".85">CLIENT</text>
<text x="104" y="80" font-size="22" font-weight="700" fill="#fff">Fernhill Roasters</text>
<text x="648" y="71" font-size="13" fill="#fff" fill-opacity=".85" text-anchor="end">holds projects and its own tasks</text>

<rect x="56" y="116" width="288" height="186" rx="16" fill="#F5F3FF" stroke="#D8D2FB" stroke-width="1.5"/><path d="M74 138h9l3 4h14a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3h-26a3 3 0 0 1-3-3v-17a3 3 0 0 1 3-3z" fill="#8B5CF6"/><text x="114" y="138" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#7C3AED">PROJECT</text><text x="114" y="157" font-size="16" font-weight="700" fill="#1E1B4B">Webshop relaunch</text><rect x="72" y="180" width="256" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="87" cy="195" r="5" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="101" y="200" font-size="13" fill="#2D2A4A">Design the checkout</text><rect x="72" y="218" width="256" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="87" cy="233" r="5" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="101" y="238" font-size="13" fill="#2D2A4A">Move customer accounts</text><rect x="72" y="256" width="256" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="87" cy="271" r="5" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="101" y="276" font-size="13" fill="#2D2A4A">Order e-mail template</text>
<rect x="360" y="116" width="288" height="186" rx="16" fill="#F5F3FF" stroke="#D8D2FB" stroke-width="1.5"/><path d="M378 138h9l3 4h14a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3h-26a3 3 0 0 1-3-3v-17a3 3 0 0 1 3-3z" fill="#8B5CF6"/><text x="418" y="138" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#7C3AED">PROJECT</text><text x="418" y="157" font-size="16" font-weight="700" fill="#1E1B4B">Loyalty app</text><rect x="376" y="180" width="256" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="391" cy="195" r="5" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="405" y="200" font-size="13" fill="#2D2A4A">Points and rewards</text><rect x="376" y="218" width="256" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="391" cy="233" r="5" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="405" y="238" font-size="13" fill="#2D2A4A">Sign-up screens</text><rect x="376" y="256" width="256" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="391" cy="271" r="5" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="405" y="276" font-size="13" fill="#2D2A4A">Push reminders</text>

<!-- Client tasks -->
<rect x="56" y="324" width="592" height="180" rx="16" fill="#ECFDF5" stroke="#34D399" stroke-width="1.8" stroke-dasharray="7 6"/>
<path d="M76 346a4 4 0 0 1 4-4h18a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4h-18a4 4 0 0 1-4-4z" fill="#10B981"/>
<path d="M82 355l5 5 9-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="118" y="350" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#059669">CLIENT TASKS</text>
<text x="118" y="369" font-size="16" font-weight="700" fill="#064E3B">Work that isn't part of a project</text>
<rect x="72" y="394" width="176" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="87" cy="409" r="5" fill="none" stroke="#10B981" stroke-width="2"/><text x="101" y="414" font-size="13" fill="#2D2A4A">Monthly retainer</text>
<rect x="262" y="394" width="176" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="277" cy="409" r="5" fill="none" stroke="#10B981" stroke-width="2"/><text x="291" y="414" font-size="13" fill="#2D2A4A">Support requests</text>
<rect x="452" y="394" width="180" height="30" rx="9" fill="#fff" stroke="#E6E2FB"/><circle cx="467" cy="409" r="5" fill="none" stroke="#10B981" stroke-width="2"/><text x="481" y="414" font-size="13" fill="#2D2A4A">Admin and invoicing</text>
<text x="72" y="462" font-size="13" fill="#047857">A task can live on a project, or straight on the client.</text>
<text x="72" y="482" font-size="13" fill="#047857">Either way, time is tracked on the task.</text>

<!-- Arrow to time -->
<path d="M676 196C700 196 706 178 728 178" fill="none" stroke="#8B5CF6" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M676 414C706 414 702 236 728 236" fill="none" stroke="#8B5CF6" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- Time card -->
<g filter="url(#soft)"><rect x="736" y="96" width="232" height="168" rx="20" fill="#fff" stroke="#CFC8F7" stroke-width="2"/></g>
<rect x="756" y="116" width="48" height="48" rx="14" fill="url(#brand)"/>
<circle cx="780" cy="141" r="14" fill="none" stroke="#fff" stroke-width="3"/>
<path d="M780 132v9l6 4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="818" y="136" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#7C3AED">THEN</text>
<text x="818" y="157" font-size="19" font-weight="700" fill="#1E1B4B">Track time</text>
<text x="756" y="194" font-size="13" fill="#4B4770">Start a timer on any task,</text>
<text x="756" y="213" font-size="13" fill="#4B4770">or add time by hand.</text>
<text x="756" y="238" font-size="13" fill="#4B4770">Billable or not.</text>

<!-- Report card -->
<path d="M852 264v34" fill="none" stroke="#8B5CF6" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#soft)"><rect x="736" y="304" width="232" height="224" rx="20" fill="#fff" stroke="#CFC8F7" stroke-width="2"/></g>
<rect x="756" y="324" width="48" height="48" rx="14" fill="#0D9488"/>
<path d="M770 355v-8M780 355v-16M790 355v-11" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="818" y="344" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#0D9488">FINALLY</text>
<text x="818" y="365" font-size="19" font-weight="700" fill="#1E1B4B">Send a report</text>
<g>
<rect x="760" y="436" width="20" height="38" rx="5" fill="url(#bar)"/><rect x="788" y="416" width="20" height="58" rx="5" fill="url(#bar)"/>
<rect x="816" y="446" width="20" height="28" rx="5" fill="url(#bar)"/><rect x="844" y="402" width="20" height="72" rx="5" fill="url(#bar)"/>
<rect x="872" y="424" width="20" height="50" rx="5" fill="url(#bar)"/><rect x="900" y="440" width="20" height="34" rx="5" fill="url(#bar)"/>
<path d="M756 475h176" stroke="#E4E1FA" stroke-width="2" stroke-linecap="round"/>
</g>
<text x="756" y="396" font-size="13" fill="#4B4770">Hours per client or project,</text>
<text x="756" y="500" font-size="13" fill="#4B4770">ready to export as a PDF.</text>
</g>
</svg>