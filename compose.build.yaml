services:
  app:
    build:
      context: ${CHRONO_BUILD_CONTEXT:-.}
      target: runner
    pull_policy: build

  migrate:
    build:
      context: ${CHRONO_BUILD_CONTEXT:-.}
      target: migrator
    pull_policy: build

  updater:
    build:
      context: ${CHRONO_BUILD_CONTEXT:-.}
      target: updater
    pull_policy: build
