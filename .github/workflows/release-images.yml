name: Publish production release

on:
  workflow_dispatch:

concurrency:
  group: chrono-production-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: version
        run: node --import tsx scripts/next-release-version.ts
      - id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          CHRONO_BUILD_VERSION: ${{ steps.version.outputs.version }}
          CHRONO_BUILD_COMMIT: ${{ steps.commit.outputs.commit }}

  images:
    needs: checks
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [runner, migrator, updater]
        platform:
          - { name: amd64, runner: ubuntu-latest }
          - { name: arm64, runner: ubuntu-24.04-arm }
        include:
          - target: runner
            image: ghcr.io/bitwave-md/chrono
          - target: migrator
            image: ghcr.io/bitwave-md/chrono-migrator
          - target: updater
            image: ghcr.io/bitwave-md/chrono-updater
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.commit }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each platform builds natively on its own architecture's runner (no QEMU),
      # and pushes by digest only. The merge job below assembles the per-arch
      # digests for each image into one multi-arch manifest and tags that.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform.name }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CHRONO_BUILD_VERSION=${{ needs.checks.outputs.version }}
            CHRONO_BUILD_COMMIT=${{ needs.checks.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/bitwave-md/chrono
            org.opencontainers.image.revision=${{ needs.checks.outputs.commit }}
            org.opencontainers.image.version=${{ needs.checks.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform.name }}
      - run: |
          mkdir -p digests
          digest='${{ steps.build.outputs.digest }}'
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform.name }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [checks, images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner
            image: ghcr.io/bitwave-md/chrono
          - target: migrator
            image: ghcr.io/bitwave-md/chrono-migrator
          - target: updater
            image: ghcr.io/bitwave-md/chrono-updater
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.target }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Combine the amd64 + arm64 digests built above into one multi-arch
      # manifest list under the version and latest tags.
      - working-directory: digests
        run: |
          docker buildx imagetools create \
            -t ${{ matrix.image }}:${{ needs.checks.outputs.version }} \
            -t ${{ matrix.image }}:latest \
            $(printf '${{ matrix.image }}@sha256:%s ' *)
      - run: |
          mkdir -p digest
          docker buildx imagetools inspect ${{ matrix.image }}:${{ needs.checks.outputs.version }} --format '{{json .Manifest}}' \
            | jq -r '.digest' > "digest/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}
          path: digest/${{ matrix.target }}
          retention-days: 1

  release:
    needs: [checks, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.checks.outputs.version }}
          COMMIT: ${{ needs.checks.outputs.commit }}
        run: |
          APP_REF="ghcr.io/bitwave-md/chrono@$(cat digests/runner)"
          MIGRATOR_REF="ghcr.io/bitwave-md/chrono-migrator@$(cat digests/migrator)"
          UPDATER_REF="ghcr.io/bitwave-md/chrono-updater@$(cat digests/updater)"
          printf '%s\n' "$VERSION" > chrono-version.txt
          cat > chrono-release.json <<EOF
          {"version":"$VERSION","commit":"$COMMIT","images":{"app":"$APP_REF","migrator":"$MIGRATOR_REF","updater":"$UPDATER_REF"}}
          EOF
          cat > chrono-release.env <<EOF
          CHRONO_VERSION=$VERSION
          CHRONO_APP_REF=$APP_REF
          CHRONO_MIGRATOR_REF=$MIGRATOR_REF
          CHRONO_UPDATER_REF=$UPDATER_REF
          EOF
          tar -czf chrono-appliance.tar.gz compose.yaml compose.external-storage.yaml scripts/backup.sh scripts/restore.sh scripts/update.sh
          cp scripts/bootstrap-update.sh bootstrap-update.sh
          sha256sum chrono-version.txt chrono-release.json chrono-release.env chrono-appliance.tar.gz bootstrap-update.sh > checksums.sha256
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "$VERSION" \
            --generate-notes \
            chrono-version.txt chrono-release.json chrono-release.env chrono-appliance.tar.gz bootstrap-update.sh checksums.sha256
